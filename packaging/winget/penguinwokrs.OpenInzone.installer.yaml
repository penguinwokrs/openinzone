# Template for winget's installer manifest. InstallerUrl, InstallerSha256 and ReleaseDate are
# per-release and are filled in by the release workflow from the setup.exe it just built and
# published; everything else here describes how that installer behaves, which does not change
# between releases. Keep this in sync with installer/openinzone.iss if that ever changes.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: penguinwokrs.OpenInzone
PackageVersion: 0.0.0 # filled in by the release workflow
InstallerLocale: en-US
Platform:
  - Windows.Desktop
MinimumOSVersion: 10.0.17763.0
InstallerType: inno
InstallerSwitches:
  Silent: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
  SilentWithProgress: /SILENT /SUPPRESSMSGBOXES /NORESTART
# openinzone.iss sets PrivilegesRequired=lowest so the installer never elevates -- see the
# comment there on why: the autostart entry it writes goes to HKCU, which must stay the
# installing user's own hive. winget must not ask for admin rights either.
Scope: user
ElevationRequirement: elevationProhibited
ReleaseDate: 2026-01-01 # filled in by the release workflow
Installers:
  - Architecture: x64
    InstallerUrl: PLACEHOLDER_INSTALLER_URL # filled in by the release workflow
    InstallerSha256: PLACEHOLDER_SHA256 # filled in by the release workflow
    # The AppId from installer/openinzone.iss, with the _is1 suffix Inno Setup appends when it
    # registers the uninstall entry that Windows -- and winget, for upgrade/uninstall -- reads.
    ProductCode: "{8E1C6B4A-3F2D-4A77-9C55-1B7E9D0A6F31}_is1"
ManifestType: installer
ManifestVersion: 1.12.0
