name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # release notes are generated from the history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: dotnet test OpenInzone.sln
        shell: bash

      - name: Publish
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          dotnet publish src/OpenInzone.Tray -c Release -r win-x64 --self-contained true \
            -p:Version="$VERSION" -o dist/tray
          # Into the tray's own output: both are self-contained win-x64 builds from the same SDK,
          # so the runtime already there is the one the daemon needs. Publishing it separately
          # would put a second complete copy of .NET in the installer and the zip.
          dotnet publish src/OpenInzone.Daemon -c Release -r win-x64 --self-contained true \
            -p:Version="$VERSION" -o dist/tray
          dotnet publish src/OpenInzone.Cli -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:Version="$VERSION" -o dist/cli

      # Runs Elgato's own CLI through npx, which is the only thing that can check a manifest the
      # way Stream Deck will and the only thing that can write the .streamDeckPlugin container.
      # Node is already on the runner, so nothing is installed.
      - name: Build the Stream Deck plugin
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash plugin/build.sh "$VERSION"

      - name: Make sure Inno Setup is present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the installer
        shell: pwsh
        env:
          OPENINZONE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\openinzone.iss

      - name: Fill in the winget manifests
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $installerName = "OpenInzone-${env:VERSION}-setup.exe"
          $url = "https://github.com/penguinwokrs/openinzone/releases/download/v${env:VERSION}/$installerName"
          $sha256 = (Get-FileHash -Path "dist\$installerName" -Algorithm SHA256).Hash
          $releaseDate = Get-Date -Format 'yyyy-MM-dd'

          New-Item -ItemType Directory -Force -Path dist\winget | Out-Null

          # The templates under packaging/winget carry everything that does not change between
          # releases; only these four values are per-release, and they are what this fills in.
          Get-ChildItem packaging\winget\*.yaml | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $content = $content -replace 'PackageVersion: 0\.0\.0.*', "PackageVersion: $env:VERSION"
            $content = $content -replace 'PLACEHOLDER_INSTALLER_URL.*', $url
            $content = $content -replace 'PLACEHOLDER_SHA256.*', $sha256
            $content = $content -replace 'ReleaseDate: 2026-01-01.*', "ReleaseDate: $releaseDate"
            Set-Content -Path (Join-Path dist\winget $_.Name) -Value $content -NoNewline
          }

      # Through env, not interpolated into the script: a tag name may contain $, ( ) or a
      # backtick, all of which PowerShell would expand inside a double-quoted string.
      - name: Zip the portable build
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Copy-Item dist\cli\inzone.exe dist\tray\
          Copy-Item LICENSE dist\tray\
          Compress-Archive -Path dist\tray\* -DestinationPath "dist\OpenInzone-${env:VERSION}-win-x64.zip"

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/OpenInzone-*-setup.exe \
            dist/OpenInzone-*-win-x64.zip \
            dist/*.streamDeckPlugin \
            dist/winget/*.yaml
